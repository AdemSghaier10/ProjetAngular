
<div class="container mt-5">

  <h2 class="text-center mb-4">Our Conferences</h2>

  <div class="row">

    @for (conf of conferences; track conf.title) {

      <div class="col-md-4 mb-4">

        <div class="card" style="width: 18rem;">

          <img
            [src]="conf.picture"
            class="card-img-top"
            [alt]="conf.title"
            style="height: 180px; object-fit: cover;">

          <div class="card-body">

            <h5 class="card-title">{{ conf.title }}</h5>

            <p class="card-text">
              <strong>Date:</strong> {{ conf.date }} <br>
              <strong>Address:</strong> {{ conf.adrs }} <br>
              <strong>Available places:</strong> {{ conf.available }}
            </p>

          </div>

        </div>

      </div>

    }

  </div>
</div>
